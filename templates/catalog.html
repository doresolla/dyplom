{% extends 'base.html' %}

{% block title %}Каталог конспектов{% endblock %}

{% block content %}
<form method="get" action="{% url 'dashboard' %}" class="search-form">
  <div class="search-group">
    <label>&nbsp;</label>
    <input type="text" placeholder="Поиск по названию" name="q" value="{{ query }}">
  </div>

  <div class="search-group">
    <label>Дата от:</label>
    <input type="date" name="date_from" value="{{ date_from }}">
  </div>

  <div class="search-group">
    <label>Дата до:</label>
    <input type="date" name="date_to" value="{{ date_to }}">
  </div>

  <div class="search-group">
    <label>&nbsp;</label>
    <input type="text" name="tag" placeholder="Поиск по тегу" value="{{ tag }}">
  </div>

  <div class="search-button">
    <label>&nbsp;</label>
    <button type="submit">🔍 Поиск</button>
  </div>
</form>
  <h2>Каталог конспектов</h2>

  <div class="summary-grid">
    {% for summary in summaries %}
      {% include 'summary_card.html' with summary=summary allow_delete=False not_favorites=True %}
    {% endfor %}
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const toggleButtons = document.querySelectorAll('.toggle-summary-btn');
      toggleButtons.forEach(btn => {
        btn.addEventListener('click', function() {
          const target = document.querySelector(this.dataset.target);
          if (target.style.display === "none") {
            target.style.display = "block";
            this.textContent = "Скрыть ▲";
          } else {
            target.style.display = "none";
            this.textContent = "Подробнее ▼";
          }
        });
      });
    });
  </script>
<style>
  .search-form {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-end;
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.search-group {
  display: flex;
  flex-direction: column;
}

.search-group label {
  font-weight: bold;
  margin-bottom: 0.2rem;
  font-size: 0.9rem;
}

.search-group input {
  padding: 0.5rem;
  border-radius: 5px;
  border: 1px solid #ccc;
  width: 200px;
  font-size: 0.9rem;
}

.search-button {
  padding: 0.5rem 1rem;
  font-weight: bold;
  background-color: #007bff;
  border: none;
  border-radius: 5px;
  color: white;
  cursor: pointer;
  transition: background-color 0.3s ease;
  font-size: 0.95rem;
  width: 200px;
}

.search-button:hover {
  background-color: #0056b3;
}
</style>
{% endblock %}
