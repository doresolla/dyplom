{% extends 'base.html' %}
{% block title %}Вход{% endblock %}

{% block content %}
  <h2>Вход в аккаунт</h2>

  {% if form.errors %}
    <p style="color:red;">Неверные учетные данные. Попробуйте снова.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Войти</button>
  </form>

  <p style="margin-top: 1rem;">
    Нет аккаунта? <a href="{% url 'register_user' %}">Зарегистрироваться</a>
  </p>
{% endblock %}
