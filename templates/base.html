{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Автоматическое конспектирование видеолекций{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=8">
</head>
<body>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            {% if user_name %}
            <h3>{{ user_name }}</h3>
            <nav class="sidebar-nav">
                <a href="{% url 'home' %}">Главная</a>
                <a href="{% url 'dashboard' %}?section=videos" class="{% if section == 'videos' %}active-sidebar-link{% endif %}">Мои видео</a>
                <a href="{% url 'dashboard' %}?section=summaries" class="{% if section == 'summaries' %}active-sidebar-link{% endif %}">Мои конспекты</a>
                <a href="{% url 'dashboard' %}?section=favorites" class="{% if section == 'favorites' %}active-sidebar-link{% endif %}">Избранное</a>
                <a href="{% url 'catalog' %}" class="{% if request.path == '/catalog/' %}active-sidebar-link{% endif %}">Каталог</a>
                <a href="{% url 'settings' %}">Настройки</a>
                <a href="#" onclick="confirmLogout(event)">Выйти из аккаунта</a>
            </nav>
            {% else %}
                <h3>Гость</h3>
                <nav class="sidebar-nav">
                    <a href="{% url 'home' %}">Главная</a>
                    <a href="{% url 'login_user' %}">Вход</a>
                </nav>
            {% endif %}
        </aside>


        <!-- Main Content -->
        <main class="dashboard-main">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
    function confirmLogout(event) {
      event.preventDefault();
      if (confirm("Вы действительно хотите выйти из аккаунта?")) {
        window.location.href = "{% url 'logout_user' %}";
      }
    }
    </script>
</body>
</html>
